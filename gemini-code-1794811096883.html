<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우연 시리즈 : 우연한 그림 - 김류민</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 타이틀 & 작가명 스타일 */
        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header-artist {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 40px;
        }

        /* 룰렛 카드 3개 컨테이너 */
        .card-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 40px;
            width: 100%;
        }

        .slot-card {
            flex: 1;
            aspect-ratio: 1 / 1;
            background-color: #0099ff;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 153, 255, 0.25);
        }

        /* 제시된 키워드 박스 (민트색 컨테이너) */
        .result-box {
            background-color: #5ffce0;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            margin-bottom: 25px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(95, 252, 224, 0.3);
            transition: transform 0.2s ease;
        }

        .result-box:hover {
            transform: scale(1.02);
        }

        .result-box h3 {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .result-box p {
            font-size: 0.9rem;
            color: #333;
        }

        /* 드로잉 이미지 및 설명 확장 영역 (클릭 시 나타남) */
        .drawing-detail-panel {
            background-color: #f9f9f9;
            border: 2px solid #5ffce0;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            margin-bottom: 25px;
            text-align: left;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #000;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawing-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #eee;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawing-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .drawing-info h4 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #111;
        }

        .drawing-info p {
            font-size: 0.9rem;
            color: #444;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            background-color: #0099ff;
            color: #ffffff;
            border: none;
            padding: 15px 0;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 153, 255, 0.3);
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #007acc;
        }

        .sub-btn {
            background-color: #333333;
        }
        .sub-btn:hover {
            background-color: #111111;
        }

        .hidden {
            display: none !important;
        }

        /* 전체 작품 보기 모달 스타일 */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 16px;
            padding: 25px;
            overflow-y: auto;
            text-align: left;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .modal-item {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
        }

        .modal-item img {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            object-fit: cover;
            background: #ddd;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 헤더 -->
        <h1 class="header-title" id="main-title">우연 시리즈 : 우연한 그림</h1>
        <div class="header-artist">김류민</div>

        <!-- 룰렛 섹션 -->
        <div id="roulette-section" style="width: 100%;">
            <div class="card-container">
                <div class="slot-card" id="card1">?</div>
                <div class="slot-card" id="card2">?</div>
                <div class="slot-card" id="card3">?</div>
            </div>
            <button class="action-btn" id="spin-btn" style="width: 100%;" onclick="stopRoulette()">멈추기 (STOP)</button>
        </div>

        <!-- 결과 선택 및 상세 보기 섹션 (처음엔 숨김) -->
        <div id="result-section" class="hidden" style="width: 100%;">
            <!-- 민트색 제시된 키워드 박스 -->
            <div class="result-box" onclick="toggleDrawingDetail()">
                <h3 id="res-keywords">키워드 1 / 키워드 2 / 키워드 3</h3>
                <p>👉 터치해서 드로잉 이미지와 설명 보기</p>
            </div>

            <!-- 드로잉 이미지 & 설명 패널 (키워드 박스 터치 시 등장) -->
            <div id="drawing-panel" class="drawing-detail-panel hidden">
                <button class="close-btn" onclick="toggleDrawingDetail()">✕</button>
                <div class="drawing-img-wrap" id="drawing-img-container">
                    <!-- 그림 이미지 또는 준비중 텍스트 -->
                </div>
                <div class="drawing-info">
                    <h4 id="res-kw-title">키워드 조합</h4>
                    <p><strong>재료:</strong> <span id="res-material">-</span></p>
                    <p><strong>설명:</strong> <span id="res-desc">-</span></p>
                </div>
            </div>

            <!-- 하단 버튼 그룹 ([다시 뽑기] & [전체 작품 보기]) -->
            <div class="btn-group">
                <button class="action-btn" onclick="resetRoulette()">다시 뽑기</button>
                <button class="action-btn sub-btn" onclick="openArchiveModal()">전체 작품 보기</button>
            </div>
        </div>
    </div>

    <!-- 전체 작품 보기 모달 -->
    <div id="archive-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>전체 작품 아카이브</h3>
                <button class="close-btn" style="position:static;" onclick="closeArchiveModal()">✕</button>
            </div>
            <div id="archive-list">
                <!-- 자바스크립트로 동적 생성됨 -->
            </div>
        </div>
    </div>

    <script>
        // 전체 12가지 키워드 풀 (룰렛이 돌아갈 때 사용)
        const keywordPool = ["음식", "동물", "풍경", "식물", "사람", "음악", "옷", "집", "사진", " 여행", "친구", "꿈"];

        // =========================================================================
        // [조합별 데이터 - 그림을 그릴 때마다 여기에 추가하세요!]
        // =========================================================================
        const artDatabase = [
            {
                keywords: ["식물", "사람", "집"],
                image: "drawing1.jpg", // 같은 폴더에 넣을 이미지 파일명
                material: "색연필, 마커",
                description: "창밖의 초록빛과 일상의 온도를 결합한 드로잉.",
                isReady: true // 그림 완성 여부 (true면 이미지 표시, false면 준비 중)
            },
            {
                keywords: ["음악", "비", "밤"],
                image: "drawing2.jpg",
                material: "오일파스텔",
                description: "빗소리와 선율을 시각화한 작업.",
                isReady: true
            },
            // [포맷 예시: 아직 그림을 못 그린 조합은 아래 형식으로 추가해두세요]
            {
                keywords: ["동물", "풍경", "꿈"],
                image: "", 
                material: "재료 입력 예정",
                description: "작품 설명 준비 중입니다.",
                isReady: false 
            }
        ];

        let isSpinning = true;
        let spinInterval;
        let currentSelectedArt = null;

        // 페이지 접속 시 자동으로 릴이 돌아가도록 설정
        function startSpinning() {
            isSpinning = true;
            document.getElementById("spin-btn").innerText = "멈추기 (STOP)";
            
            spinInterval = setInterval(() => {
                document.getElementById("card1").innerText = keywordPool[Math.floor(Math.random() * keywordPool.length)];
                document.getElementById("card2").innerText = keywordPool[Math.floor(Math.random() * keywordPool.length)];
                document.getElementById("card3").innerText = keywordPool[Math.floor(Math.random() * keywordPool.length)];
            }, 80);
        }

        // [멈추기] 버튼 클릭 시 순차적으로 멈춤
        function stopRoulette() {
            if (!isSpinning) return;
            isSpinning = false;
            clearInterval(spinInterval);

            // artDatabase 중에서 무작위로 하나 선택 (등록된 데이터 기반)
            currentSelectedArt = artDatabase[Math.floor(Math.random() * artDatabase.length)];

            // 1번 칸 멈춤
            document.getElementById("card1").innerText = currentSelectedArt.keywords[0];
            
            // 0.3초 뒤 2번 칸 멈춤
            setTimeout(() => {
                document.getElementById("card2").innerText = currentSelectedArt.keywords[1];
            }, 300);

            // 0.6초 뒤 3번 칸 멈추고 결과 화면 표시 준비
            setTimeout(() => {
                document.getElementById("card3").innerText = currentSelectedArt.keywords[2];
                
                // 결과 데이터 바인딩
                document.getElementById("res-keywords").innerText = `${currentSelectedArt.keywords[0]} / ${currentSelectedArt.keywords[1]} / ${currentSelectedArt.keywords[2]}`;
                document.getElementById("res-kw-title").innerText = `[ ${currentSelectedArt.keywords.join(" - ")} ]`;
                document.getElementById("res-material").innerText = currentSelectedArt.material;
                document.getElementById("res-desc").innerText = currentSelectedArt.description;

                // 이미지 영역 세팅
                const imgContainer = document.getElementById("drawing-img-container");
                if (currentSelectedArt.isReady && currentSelectedArt.image) {
                    imgContainer.innerHTML = `<img src="${currentSelectedArt.image}" alt="드로잉 작품">`;
                } else {
                    imgContainer.innerHTML = `<span style="color:#666; font-size:0.95rem;">[그림 준비 중인 작품입니다]</span>`;
                }

                // 화면 전환 (룰렛 숨기고 결과 섹션 보이기)
                document.getElementById("roulette-section").classList.add("hidden");
                document.getElementById("result-section").classList.remove("hidden");
                
                // 상세 패널은 처음에 접혀있도록 초기화
                document.getElementById("drawing-panel").classList.add("hidden");
            }, 600);
        }

        // 제시된 키워드 박스를 누르면 드로잉 이미지와 설명 패널이 부드럽게 나타남 / 닫힘
        function toggleDrawingDetail() {
            const panel = document.getElementById("drawing-panel");
            panel.classList.toggle("hidden");
        }

        // 다시 뽑기
        function resetRoulette() {
            document.getElementById("result-section").classList.add("hidden");
            document.getElementById("roulette-section").classList.remove("hidden");
            startSpinning();
        }

        // 전체 작품 보기 모달 열기
        function openArchiveModal() {
            const archiveList = document.getElementById("archive-list");
            archiveList.innerHTML = "";

            artDatabase.forEach((art, index) => {
                const item = document.createElement("div");
                item.className = "modal-item";
                
                let imgHtml = art.isReady && art.image ? `<img src="${art.image}" alt="작품">` : `<div style="width:70px; height:70px; background:#eee; display:flex; align-items:center; justify-content:center; font-size:0.75rem; color:#666; border-radius:6px; text-align:center;">준비중</div>`;
                
                item.innerHTML = `
                    ${imgHtml}
                    <div>
                        <h4 style="font-size:0.95rem; margin-bottom:4px;">#${index+1} ${art.keywords.join(" / ")}</h4>
                        <p style="font-size:0.85rem; color:#555; margin-bottom:2px;"><strong>재료:</strong> ${art.material}</p>
                        <p style="font-size:0.8rem; color:#777;">${art.description}</p>
                    </div>
                `;
                archiveList.appendChild(item);
            });

            document.getElementById("archive-modal").classList.remove("hidden");
        }

        // 전체 작품 보기 모달 닫기
        function closeArchiveModal() {
            document.getElementById("archive-modal").classList.add("hidden");
        }

        // 페이지 로드 시 자동으로 룰렛 회전 시작
        window.onload = function() {
            startSpinning();
        };
    </script>
</body>
</html>
